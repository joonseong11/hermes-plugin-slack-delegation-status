name: Static integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile repository Python
        run: python -m py_compile __init__.py tests/test_status.py
      - name: Check manifest identity
        run: 'python -c "from pathlib import Path; s=Path(\"plugin.yaml\").read_text(); assert \"version: 0.7.1\" in s; assert \"homepage: https://github.com/joonseong11/hermes-plugin-slack-delegation-status\" in s"'
